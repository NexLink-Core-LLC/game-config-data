# ─────────────────────────────────────────────
# Palworld — Combat & PvP
# All settings map into OptionSettings=(...) in PalWorldSettings.ini.
# ─────────────────────────────────────────────
name: Combat & PvP
settings:

  - property: bIsPvP
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Enable PvP
    type: checkbox
    default: false
    helpText: Enable player-versus-player combat on the server.

  - property: bEnablePlayerToPlayerDamage
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Player-to-Player Damage
    type: checkbox
    default: false
    helpText: Allow players to deal damage directly to other players.

  - property: bEnableFriendlyFire
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Friendly Fire
    type: checkbox
    default: false
    helpText: Allow damage between members of the same guild.

  - property: bEnableInvaderEnemy
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Enable Invaders
    type: checkbox
    default: true
    helpText: Allow raid/invader enemies to attack bases.

  - property: bEnableDefenseOtherGuildPlayer
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Defend Against Other Guilds
    type: checkbox
    default: false
    helpText: Allow base defense facilities to attack players from other guilds.

  - property: PlayerDamageRateAttack
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Player Attack Damage
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 5
    helpText: Multiplier for damage dealt by players.

  - property: PlayerDamageRateDefense
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Player Defense
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 5
    helpText: Multiplier for damage taken by players (higher = more damage taken).

  - property: PalDamageRateAttack
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Pal Attack Damage
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 5
    helpText: Multiplier for damage dealt by Pals.

  - property: PalDamageRateDefense
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Pal Defense
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 5
    helpText: Multiplier for damage taken by Pals (higher = more damage taken).

  - property: bEnableAimAssistPad
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Aim Assist (Controller)
    type: checkbox
    default: true
    helpText: Enable aim assist for controller players.

  - property: bEnableAimAssistKeyboard
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Aim Assist (Keyboard)
    type: checkbox
    default: false
    helpText: Enable aim assist for keyboard/mouse players.

  # ── PvP kill drops & map visibility ───────────────────────────────────

  - property: bAdditionalDropItemWhenPlayerKillingInPvPMode
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Drop Item on PvP Kill
    type: checkbox
    default: false
    dependsOn: bIsPvP
    helpText: When enabled, killing a player in PvP drops an additional configurable item.

  - property: AdditionalDropItemWhenPlayerKillingInPvPMode
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: PvP Kill Drop Item ID
    type: text
    default: ""
    dependsOn: bAdditionalDropItemWhenPlayerKillingInPvPMode
    helpText: ID of the item dropped when a player is killed in PvP.

  - property: AdditionalDropItemNumWhenPlayerKillingInPvPMode
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: PvP Kill Drop Quantity
    type: number
    default: 0
    step: 1
    min: 0
    max: 100
    dependsOn: bAdditionalDropItemWhenPlayerKillingInPvPMode
    helpText: Quantity of the configured item dropped when a player is killed in PvP.

  - property: bDisplayPvPItemNumOnWorldMap_Player
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Show PvP Items on Map (Players)
    type: checkbox
    default: true
    dependsOn: bIsPvP
    helpText: Show player locations and their PvP-exclusive item counts on the world map.

  - property: bDisplayPvPItemNumOnWorldMap_BaseCamp
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Show PvP Items on Map (Bases)
    type: checkbox
    default: true
    dependsOn: bIsPvP
    helpText: Show the number of PvP-exclusive items held at each base on the world map.
