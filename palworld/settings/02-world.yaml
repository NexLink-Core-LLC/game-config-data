# ─────────────────────────────────────────────
# Palworld — World & Progression
# All settings map into OptionSettings=(...) in PalWorldSettings.ini.
# ─────────────────────────────────────────────
name: World & Progression
settings:

  - property: DayTimeSpeedRate
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Day Time Speed
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 5
    helpText: How fast daytime passes. Higher = shorter days.

  - property: NightTimeSpeedRate
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Night Time Speed
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 5
    helpText: How fast nighttime passes. Higher = shorter nights.

  - property: ExpRate
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: EXP Rate
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 20
    helpText: Multiplier for all experience gained by players and Pals.

  - property: WorkSpeedRate
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Work Speed Rate
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 20
    helpText: Multiplier for how fast Pals perform work at your base.

  - property: MonsterFarmActionSpeedRate
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Ranch Production Speed
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 20
    helpText: Multiplier for how fast Pals produce items while grazing at a Ranch.

  - property: PalEggDefaultHatchingTime
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Egg Hatching Time (hours)
    type: number
    default: 72
    step: 1
    min: 0
    max: 240
    helpText: Base time in hours for a Pal egg to hatch. Set to 0 for instant hatching.

  - property: bEnableFastTravel
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Enable Fast Travel
    type: checkbox
    default: true
    helpText: Allow players to fast travel between unlocked statues.

  - property: bEnableFastTravelOnlyBaseCamp
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Fast Travel Only Between Bases
    type: checkbox
    default: false
    dependsOn: bEnableFastTravel
    helpText: Restrict fast travel so players can only warp between their own base camps.

  - property: bIsStartLocationSelectByMap
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Choose Start Location on Map
    type: checkbox
    default: true
    helpText: Let players pick their starting location from the map on first join.

  - property: bExistPlayerAfterLogout
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Keep Player After Logout
    type: checkbox
    default: false
    helpText: Keep the player's body in the world after they log out.

  # ── Stat point allocation ─────────────────────────────────────────────

  - property: bAllowEnhanceStat_Health
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Allow Stat Points → HP
    type: checkbox
    default: true
    helpText: Allow players to spend stat points to increase their maximum HP.

  - property: bAllowEnhanceStat_Attack
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Allow Stat Points → Attack
    type: checkbox
    default: true
    helpText: Allow players to spend stat points to increase their attack.

  - property: bAllowEnhanceStat_Stamina
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Allow Stat Points → Stamina
    type: checkbox
    default: true
    helpText: Allow players to spend stat points to increase their stamina.

  - property: bAllowEnhanceStat_Weight
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Allow Stat Points → Carry Weight
    type: checkbox
    default: true
    helpText: Allow players to spend stat points to increase their carry weight.

  - property: bAllowEnhanceStat_WorkSpeed
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Allow Stat Points → Work Speed
    type: checkbox
    default: true
    helpText: Allow players to spend stat points to increase their work speed.

  # ── World events & randomizer ─────────────────────────────────────────

  - property: SupplyDropSpan
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Supply Drop Interval (minutes)
    type: number
    default: 180
    step: 1
    min: 0
    max: 1440
    helpText: Interval in minutes between meteorite / supply drops in the world.

  - property: RandomizerType
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Pal Randomizer Mode
    type: select
    default: None
    options:
      - None
      - Region
      - All
    helpText: Pal spawn randomization. None = no randomization; Region = shuffled within each region; All = fully randomized.

  - property: RandomizerSeed
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Randomizer Seed
    type: text
    default: ""
    dependsOn: RandomizerType
    helpText: Seed used when the Pal randomizer is enabled. Leave blank for a random seed.

  - property: bIsRandomizerPalLevelRandom
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Randomize Pal Levels
    type: checkbox
    default: false
    dependsOn: RandomizerType
    helpText: When on, wild Pal levels are fully random. When off, levels stay within each area's intended range.

  - property: DenyTechnologyList
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Disabled Technologies
    type: text
    default: ""
    fullWidth: true
    helpText: Comma-separated list of Technology IDs to disable (prevents players from unlocking them). Leave blank to allow all.
