# ─────────────────────────────────────────────
# Palworld — Base Camp & Guild
# All settings map into OptionSettings=(...) in PalWorldSettings.ini.
# ─────────────────────────────────────────────
name: Base Camp & Guild
settings:

  - property: BaseCampMaxNum
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Max Base Camps
    type: number
    default: 128
    step: 1
    min: 1
    max: 512
    helpText: Maximum number of base camps allowed on the server.

  - property: BaseCampWorkerMaxNum
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Max Base Workers
    type: number
    default: 15
    step: 1
    min: 1
    max: 50
    helpText: Maximum number of working Pals assigned to a single base camp.

  - property: BaseCampMaxNumInGuild
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Max Base Camps Per Guild
    type: number
    default: 4
    step: 1
    min: 1
    max: 10
    helpText: Maximum number of base camps a single guild may own (max 10). Higher values increase server load.

  - property: GuildPlayerMaxNum
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Max Guild Members
    type: number
    default: 20
    step: 1
    min: 1
    max: 100
    helpText: Maximum number of players allowed in a single guild.

  - property: CoopPlayerMaxNum
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Max Co-op Players Per Guild
    type: number
    default: 4
    step: 1
    min: 1
    max: 32
    helpText: Maximum number of players that can belong to the same base guild in co-op.

  - property: bAutoResetGuildNoOnlinePlayers
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Auto-Reset Inactive Guilds
    type: checkbox
    default: false
    helpText: Automatically disband guilds that have had no players online for a set time.

  - property: AutoResetGuildTimeNoOnlinePlayers
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Guild Reset Time (hours)
    type: number
    default: 72
    step: 1
    min: 1
    max: 720
    dependsOn: bAutoResetGuildNoOnlinePlayers
    helpText: Hours of no online guild members before a guild is auto-reset.

  - property: GuildRejoinCooldownMinutes
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Guild Rejoin Cooldown (minutes)
    type: number
    default: 0
    step: 1
    min: 0
    max: 1440
    helpText: How long a player must wait before rejoining a guild after leaving. 0 = no cooldown.

  - property: bInvisibleOtherGuildBaseCampAreaFX
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Hide Other Guilds' Base Boundaries
    type: checkbox
    default: false
    helpText: Hide the visual base-area boundary effect for base camps belonging to other guilds.

  - property: bAllowGlobalPalboxExport
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Allow Global Palbox Export
    type: checkbox
    default: true
    helpText: Allow players to save Pals from this server to the Global Palbox.

  - property: bAllowGlobalPalboxImport
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Allow Global Palbox Import
    type: checkbox
    default: true
    helpText: Allow players to load Pals from the Global Palbox onto this server.
