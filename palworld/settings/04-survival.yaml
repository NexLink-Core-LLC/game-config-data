# ─────────────────────────────────────────────
# Palworld — Survival Rates (Players & Pals)
# All settings map into OptionSettings=(...) in PalWorldSettings.ini.
# For each rate, higher = the resource drains faster (harder survival).
# ─────────────────────────────────────────────
name: Survival Rates
settings:

  - property: PlayerStomachDecreaceRate
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Player Hunger Drain
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 5
    helpText: How fast a player's hunger (stomach) decreases.

  - property: PlayerStaminaDecreaceRate
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Player Stamina Drain
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 5
    helpText: How fast a player's stamina decreases.

  - property: PlayerAutoHPRegeneRate
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Player HP Regen
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 5
    helpText: How fast a player's health regenerates over time.

  - property: PlayerAutoHpRegeneRateInSleep
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Player HP Regen (Sleep)
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 5
    helpText: How fast a player's health regenerates while sleeping in a bed.

  - property: PalStomachDecreaceRate
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Pal Hunger Drain
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 5
    helpText: How fast a Pal's hunger (stomach) decreases.

  - property: PalStaminaDecreaceRate
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Pal Stamina Drain
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 5
    helpText: How fast a Pal's stamina decreases.

  - property: PalAutoHPRegeneRate
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Pal HP Regen
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 5
    helpText: How fast a Pal's health regenerates over time.

  - property: PalAutoHpRegeneRateInSleep
    section: "[/Script/Pal.PalGameWorldSettings]"
    label: Pal HP Regen (Base)
    type: number
    default: 1
    step: 0.1
    min: 0.1
    max: 5
    helpText: How fast a Pal's health regenerates while resting at a Palbox.
