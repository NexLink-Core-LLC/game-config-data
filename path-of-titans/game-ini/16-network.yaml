# ─────────────────────────────────────────────
# Field Reference
# ─────────────────────────────────────────────
#
# REQUIRED FIELDS:
#   property       INI property name (e.g. bServerGrowth=)
#   label          Display name shown in the panel UI
#   type           Input type (see Input Types below)
#   default        Default value when the setting is not set
#
# OPTIONAL FIELDS:
#   helpText       Help description shown to the user
#   section        INI file section e.g. "[/Script/PathOfTitans.IGameSession]"
#   subheader      Sub-group label within the section
#   configType     Set to "server-variable" for Pterodactyl startup variables
#                  (omit for Game.ini settings)
#   repeatable     true | false — can this setting appear multiple times
#   fullWidth      true | false — force the field to take the full row
#   min            Minimum allowed value (number type only)
#   max            Maximum allowed value (number type only)
#   step           Increment step size (number type only, e.g. 1 for whole numbers)
#   options        List of allowed values (select type only)
#   dependsOn      Only show this setting when another setting is enabled
#                  (use the property name, e.g. dependsOn: bServerDynamicTimeOfDay)
#
# ─────────────────────────────────────────────
# Input Types
# ─────────────────────────────────────────────
#
#   text       A free-text input field. The user can type anything.
#              Example: Server name, Discord invite code
#
#   number     A numeric input with optional min/max/step constraints.
#              Use "min" and "max" to set allowed range.
#              Use "step" to control increment (e.g. step: 1 for integers,
#              step: 0.01 for decimals).
#              Example: Player slots, cooldown timers, growth multipliers
#
#   checkbox   A toggle switch (true/false). Shows as a checkbox in the UI.
#              Default should be true or false.
#              Example: Enable/disable features like fall damage, chat, nesting
#
#   select     A dropdown menu with predefined choices. Requires an "options"
#              list with all allowed values. The user picks one.
#              Example: Server map selection (Island, Panjura, Riparia)
#
#   password   A text field that hides the input (shown as dots).
#              Used for sensitive values like passwords.
#              Example: Server password, RCON password
#
#   string-list  A list of bare text values. The game repeats the key once
#              per value ("Key=A" then "Key=B"), so this is NOT a comma-
#              separated text field — using "text" for a repeated key makes
#              the writer stamp one value over every existing line.
#              Example: Disabled waystone tags, VPN-exempt Alderon IDs
#
# ─────────────────────────────────────────────
name: Network Settings
settings:
  -
    subheader: ""
    property: MaxClientPingMs=
    label: Max Client Ping (ms)
    type: number
    repeatable: false
    default: 0
    helpText: Specifies the maximum ms ping before auto-disconnecting the player.
      `0` will disable this option. Use to prevent high-ping players causing
      issues for your server.
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: ""
    property: MaxClientPingDuration=
    label: Max Client Ping Duration (ms)
    type: number
    repeatable: false
    default: 0
    helpText: Specifies the maximum duration (in milliseconds) for which a client
      can exceed the ping limit before being disconnected. `0` will disable this
      option.
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: ""
    property: bDisableGrouping=
    label: Disable Grouping
    type: checkbox
    repeatable: false
    default: false
    helpText: If enabled, players will not be grouped together in the server.
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: ""
    property: bServerCombatTimerAppliesToGroup=
    label: Server Combat Timer Applies to Group
    type: checkbox
    repeatable: false
    default: true
    helpText: If enabled, the server combat timer will apply to all players in a group.
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: ""
    property: bServerAllowChangeSubspecies=
    label: Allow Change Subspecies
    type: checkbox
    repeatable: false
    default: true
    helpText: If enabled, players will be allowed to change their dinosaur's subspecies.
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: "Connection Blocking"
    property: bServerBlockVPN=
    label: Block VPN Connections
    type: checkbox
    repeatable: false
    default: false
    helpText: If `enabled`, players connecting through a known VPN are refused
      entry to the server. Detection is Alderon's, not the panel's, so a
      legitimate player on a corporate or privacy VPN can be caught by it — add
      them to `VPN/Datacenter Exempt IDs` below rather than switching this off.
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: "Connection Blocking"
    property: bServerBlockDatacenter=
    label: Block Datacenter Connections
    type: checkbox
    repeatable: false
    default: false
    helpText: If `enabled`, players connecting from a known datacenter IP range
      are refused entry. Worth pairing with `Block VPN Connections`, since many
      commercial VPNs exit through datacenter ranges.
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: "Connection Blocking"
    property: VPNExemptIds=
    label: VPN/Datacenter Exempt IDs
    type: string-list
    repeatable: true
    default: ""
    fullWidth: true
    helpText: Alderon IDs allowed in even when the VPN or datacenter blocks above
      would otherwise refuse them. One ID per entry, in `123-456-789` form. Has
      no effect while both blocks are off.
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: "Replays"
    property: bHandleDedicatedServerReplays=
    label: Enable Server-Side Replays
    type: checkbox
    repeatable: false
    default: false
    helpText: If `enabled`, the server records replays of its own, rather than
      relying on players recording theirs. Separate from `Enable Replay
      Recording`, which is the client-side setting, and written to a different
      section of Game.ini. Alderon ships this as experimental.
    section: "[/Game/Blueprints/GameModes/BP_GameMode_Sandbox.BP_GameMode_Sandbox_C]"