# ─────────────────────────────────────────────
# Field Reference
# ─────────────────────────────────────────────
#
# REQUIRED FIELDS:
#   property       INI property name (e.g. bServerGrowth=)
#   label          Display name shown in the panel UI
#   type           Input type (see Input Types below)
#   default        Default value when the setting is not set
#
# OPTIONAL FIELDS:
#   helpText       Help description shown to the user
#   section        INI file section e.g. "[/Script/PathOfTitans.IGameSession]"
#   subheader      Sub-group label within the section
#   configType     Set to "server-variable" for Pterodactyl startup variables
#                  (omit for Game.ini settings)
#   repeatable     true | false — can this setting appear multiple times
#   fullWidth      true | false — force the field to take the full row
#   min            Minimum allowed value (number type only)
#   max            Maximum allowed value (number type only)
#   step           Increment step size (number type only, e.g. 1 for whole numbers)
#   options        List of allowed values (select type only)
#   dependsOn      Only show this setting when another setting is enabled
#                  (use the property name, e.g. dependsOn: bServerDynamicTimeOfDay)
#
# ─────────────────────────────────────────────
# Input Types
# ─────────────────────────────────────────────
#
#   text       A free-text input field. The user can type anything.
#              Example: Server name, Discord invite code
#
#   number     A numeric input with optional min/max/step constraints.
#              Use "min" and "max" to set allowed range.
#              Use "step" to control increment (e.g. step: 1 for integers,
#              step: 0.01 for decimals).
#              Example: Player slots, cooldown timers, growth multipliers
#
#   checkbox   A toggle switch (true/false). Shows as a checkbox in the UI.
#              Default should be true or false.
#              Example: Enable/disable features like fall damage, chat, nesting
#
#   select     A dropdown menu with predefined choices. Requires an "options"
#              list with all allowed values. The user picks one.
#              Example: Server map selection (Island, Panjura, Riparia)
#
#   password   A text field that hides the input (shown as dots).
#              Used for sensitive values like passwords.
#              Example: Server password, RCON password
#
# ─────────────────────────────────────────────
name: Character Management
settings:
  -
    subheader: ""
    property: MaxCharactersPerPlayer=
    label: Max Characters Per Player
    type: number
    min: 1
    max: 50
    repeatable: false
    default: 30
    helpText: Sets the maximum number of characters a player can create.
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: ""
    property: MaxCharactersPerSpecies=
    label: Max Characters Per Species
    type: number
    min: 1
    max: 50
    repeatable: false
    default: 1
    helpText: Sets the maximum number of characters a player can create per species.
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: "Spawn Limits"
    property: bEnableMaxHerbivores
    label: Limit Herbivores
    type: checkbox
    repeatable: false
    default: false
    fullWidth: false
    helpText: "Panel-only toggle — not a Game.ini setting. Off leaves MaxHerbivores out of Game.ini entirely, which means unlimited herbivores. Turn on to set a cap."
  -
    subheader: "Spawn Limits"
    property: MaxHerbivores=
    label: Max Herbivores
    type: number
    min: 0
    step: 1
    repeatable: false
    default: ""
    fullWidth: false
    dependsOn: bEnableMaxHerbivores
    helpText: "Maximum number of herbivores that can be spawned in at once across the whole server. Set to 0 to disable herbivores entirely — to allow unlimited herbivores instead, turn off Limit Herbivores above. Players picking a herbivore while the server is at this limit get an \"Unable to Spawn\" message and stay on the character select screen; slots free up when a creature dies or its player logs out."
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: "Spawn Limits"
    property: bEnableMaxCarnivores
    label: Limit Carnivores
    type: checkbox
    repeatable: false
    default: false
    fullWidth: false
    helpText: "Panel-only toggle — not a Game.ini setting. Off leaves MaxCarnivores out of Game.ini entirely, which means unlimited carnivores. Turn on to set a cap."
  -
    subheader: "Spawn Limits"
    property: MaxCarnivores=
    label: Max Carnivores
    type: number
    min: 0
    step: 1
    repeatable: false
    default: ""
    fullWidth: false
    dependsOn: bEnableMaxCarnivores
    helpText: "Maximum number of carnivores that can be spawned in at once across the whole server. Set to 0 to disable carnivores entirely — to allow unlimited carnivores instead, turn off Limit Carnivores above. Players picking a carnivore while the server is at this limit get an \"Unable to Spawn\" message and stay on the character select screen; slots free up when a creature dies or its player logs out."
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: "Spawn Limits"
    property: CharacterSpawnLimits=
    label: Per-Species Spawn Limits
    type: character-spawn-limits
    repeatable: true
    default: ""
    fullWidth: true
    helpText: "Caps how many of a single species can be spawned in at once, on top of the overall herbivore/carnivore limits. Add one row per creature. Writes as CharacterSpawnLimits=(Character=Anodontosaurus,Max=10). Modded creatures are supported — use the creature name the mod ships."
