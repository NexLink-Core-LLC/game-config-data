# ─────────────────────────────────────────────
# Field Reference
# ─────────────────────────────────────────────
#
# REQUIRED FIELDS:
#   property       INI property name (e.g. bServerGrowth=)
#   label          Display name shown in the panel UI
#   type           Input type (see Input Types below)
#   default        Default value when the setting is not set
#
# OPTIONAL FIELDS:
#   helpText       Help description shown to the user
#   section        INI file section e.g. "[/Script/PathOfTitans.IGameSession]"
#   subheader      Sub-group label within the section
#   configType     Set to "server-variable" for Pterodactyl startup variables
#                  (omit for Game.ini settings)
#   repeatable     true | false — can this setting appear multiple times
#   fullWidth      true | false — force the field to take the full row
#   min            Minimum allowed value (number type only)
#   max            Maximum allowed value (number type only)
#   step           Increment step size (number type only, e.g. 1 for whole numbers)
#   options        List of allowed values (select type only)
#   dependsOn      Only show this setting when another setting is enabled
#                  (use the property name, e.g. dependsOn: bServerDynamicTimeOfDay)
#
# ─────────────────────────────────────────────
# Input Types
# ─────────────────────────────────────────────
#
#   text       A free-text input field. The user can type anything.
#              Example: Server name, Discord invite code
#
#   number     A numeric input with optional min/max/step constraints.
#              Use "min" and "max" to set allowed range.
#              Use "step" to control increment (e.g. step: 1 for integers,
#              step: 0.01 for decimals).
#              Example: Player slots, cooldown timers, growth multipliers
#
#   checkbox   A toggle switch (true/false). Shows as a checkbox in the UI.
#              Default should be true or false.
#              Example: Enable/disable features like fall damage, chat, nesting
#
#   select     A dropdown menu with predefined choices. Requires an "options"
#              list with all allowed values. The user picks one.
#              Example: Server map selection (Island, Panjura, Riparia)
#
#   password   A text field that hides the input (shown as dots).
#              Used for sensitive values like passwords.
#              Example: Server password, RCON password
#
#   string-list  A list of bare text values. The game repeats the key once
#              per value ("Key=A" then "Key=B"), so this is NOT a comma-
#              separated text field — using "text" for a repeated key makes
#              the writer stamp one value over every existing line.
#              Example: Disabled waystone tags, VPN-exempt Alderon IDs
#
# ─────────────────────────────────────────────
name: Waystone Settings
settings:
  -
    subheader: ""
    property: bServerWaystones=
    label: Enable Waystones
    type: checkbox
    repeatable: false
    default: true
    helpText: Enables or disables Waystones on your server.
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: ""
    property: bServerAllowInGameWaystone=
    label: Allow In-Game Waystone
    type: checkbox
    repeatable: false
    default: true
    helpText: Enables or disables waystones. Setting this as false requires players
      to use the old method of using the Waystone by retuning to the Character
      Menu screen.
    dependsOn: bServerWaystones
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: ""
    property: bServerWaystoneCooldownRemoval=
    label: Remove Waystone Cooldown
    type: checkbox
    repeatable: false
    default: true
    helpText: Enables or disables the ability for players to spend marks to
      insta-cooldown Waystones.
    dependsOn: bServerWaystones
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: ""
    property: OverrideWaystoneCooldown=
    label: Override Waystone Cooldown
    type: number
    min: -1
    repeatable: false
    default: -1
    helpText: Overrides the cooldown timer for Waystones in seconds. -1 will use the
      default cooldown timer.
    dependsOn: bServerWaystones
    section: "[/Script/PathOfTitans.IGameSession]"
  -
    subheader: ""
    property: ServerDisabledWaystones=
    label: Disabled Waystones
    type: string-list
    repeatable: true
    default: ""
    fullWidth: true
    helpText: "Switch off individual waystones while leaving the rest working. One
      POI tag per entry, matching the waystone's own name — for example
      `TitansPass` or `CentralWaystone`. Run `/ListWaystones` in the console to
      see the tags this map uses. KNOWN GAME BUG: a player already holding the
      `Restore Waystone` quest for a waystone disabled here is stuck with it and
      cannot complete it. You may need to remove or complete that quest for them
      by hand until Alderon fixes it."
    dependsOn: bServerWaystones
    section: "[/Script/PathOfTitans.IGameSession]"
